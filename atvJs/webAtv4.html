<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <style>

        #container{
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

        }

        .inputArea{
            margin-bottom: 3vh;
            
        }
    
    </style>


<div id="container">
    <h1>Teste de IMC</h1>

    
        <input id="campoNome" class="inputArea" type="text" placeholder="Nome">
    

    
        <input id="campoPeso" class="inputArea" type="text" placeholder="Peso(Kg)">
    

    
        <input id="campoAltura" class="inputArea" type = "text" placeholder="Altura(m)">
    

    <button id="btnConfirmar">Confirmar!</button>

    <p id="textoResultado"></p>

    <img src="" id="imgResultado">
</div>

    <script>

    var imc = 0
    const campoNome = document.getElementById("campoNome")
    const campoPeso = document.getElementById("campoPeso")
    const campoAltura = document.getElementById("campoAltura")
    const btnConfirmar = document.getElementById("btnConfirmar")
    const imgResultado = document.getElementById("imgResultado")

    btnConfirmar.addEventListener("click", function(){

        if(campoNome.value == "" || campoAltura.value == "" || campoPeso.value == ""){
            alert("Preencha todos os campos!!!")
            return                                                                                                                                                                                                                                     

        }

        if(campoAltura.value <= 0 || campoPeso.value <= 0){
            alert("Altura e peso precisam ser diferentes de 0")
            return                                                                                                                                                                                                                                     

        }

        tipoImc = ""

        peso = parseFloat(campoPeso.value)
        altura = parseFloat(campoAltura.value)
        
        
        imc = peso / (altura * altura)
        document.getElementById("textoResultado")
        
        if(imc < 18.5){
            imgResultado.src = "imagens/abaixopeso.png"
            tipoImc = "Baixo do peso"

        } else if (18.5 <= imc && imc < 24.9) {
            imgResultado.src = "imagens/normal.png"
            tipoImc = "Peso normal"
            
        } else if (25 <= imc && imc < 29.9) {
            imgResultado.src = "imagens/sobrepeso.png"
            tipoImc = "Sobrepeso"
            
        } else if (30 <= imc && imc < 34.9) {
            imgResultado.src = "imagens/obesidade1.png"
            tipoImc = "Obesidade grau 1"
            
        } else if (35 <= imc && imc < 39.9) {
            imgResultado.src = "imagens/obesidade2.png"
            tipoImc = "Obesidade grau 2"
        } else if (imc > 40) {
            imgResultado.src = "imagens/obesidade3.png"
            tipoImc = "Obesidade grau 3"

        }

        textoResultado.textContent = campoNome.value + " seu IMC é de: " + imc.toFixed(2) + " - " + tipoImc ;


    })

    
    
        
    </script>


</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body id="background">
    
 <button id="btnMudarCor">Mudar cor</button>

 <script>

    const background = document.getElementById("background")
    const btnMudarCor = document.getElementById("btnMudarCor")

    btnMudarCor.addEventListener("click", function(){
        background.style.backgroundColor = "#" + Math.floor(Math.random() * 0x1000000).toString(16).padStart(6, "0");

    })

 </script>

</body>
</html>

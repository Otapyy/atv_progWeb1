<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<body>
    
    <style>

        * {
            margin: 0;
            padding: 0;

        }

        #container{
            display: flex;
            flex-direction: row;

        }

        #bandeira1Fundo{
            display: flex;
            width: 33vw;
            height: 40vh;
            background-color: white;
            justify-content: center;
            align-items: center;
            
        }

        #centroBandeira{
            height: 15vh;
            width: 15vh;
            border-radius: 50%;
            background-color: red;

        }

        #geralBandeira1{
            display: flex;
            flex-direction: column;
            width: 33vw;
            height: 40vh;
            
        }

        #linha1{
            
            width: 100%;
            height: 33%;
            background-color: red;
            
        }

        #linha2{
           width: 100%;
            height: 34%;
            background-color: white; 

        }

        #linha3{
            
            width: 100%;
            height: 33%;
            background-color: blue;
            
        }

        #geralBandeira2{
            display: flex;
            flex-direction: row;
            width: 33vw;
            height: 40vh;
            
        }

        #linha4{
            
            width: 33%;
            height: 100%;
            background-color: green;
            
        }

        #linha5{
           width: 33%;
            height: 100%;
            background-color: white; 

        }

        #linha6{
            
            width: 33%;
            height: 100%;
            background-color: red;
            
        }

    </style>


<div id="container">

    <div id="bandeira1Fundo">
        <div id="centroBandeira"></div>
    </div>

    <div id="geralBandeira1">
        <div id="linha1"></div>
        <div id="linha2"></div>
        <div id="linha3"></div>
    </div>

    <div id="geralBandeira2">
        <div id="linha4"></div>
        <div id="linha5"></div>
        <div id="linha6"></div>
    </div>

</div>
</body>
</html>

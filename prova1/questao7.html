<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <style>

         
        body:hover{
            animation: rotacionar 4s linear infinite;

        }

        @keyframes rotacionar {
            0%{ transform: rotate(0deg); }
            100%{ transform: rotate(360deg); }

        }


        #bola1{
            position: fixed;
            width: 15vh;
            height: 15vh;
            background-color: brown;
            border-radius: 50%;
            top: 0%;
            left: 0%;
            

        }

        #bola2{
            position: fixed;
            width: 15vh;
            height: 15vh;
            background-color: lightblue;
            border-radius: 50%;
            top: 0%;
            right: 0%;

        }

        #bola3{
            position: fixed;
            width: 15vh;
            height: 15vh;
            background-color: purple;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

        }

        #bola4{
            position: fixed;
            width: 15vh;
            height: 15vh;
            background-color: lightgreen;
            border-radius: 50%;
            bottom: 0%;
            left: 0%;

        }

        #bola5{
            position: fixed;
            width: 15vh;
            height: 15vh;
            background-color: lightyellow;
            border-radius: 50%;
            bottom: 0%;
            right: 0%;

        }

       
    </style>



    <div id="bola1"></div>
    <div id="bola2"></div>
    <div id="bola3"></div>
    <div id="bola4"></div>
    <div id="bola5"></div> 

</body>
</html>

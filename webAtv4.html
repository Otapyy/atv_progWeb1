<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <style>

        #container{
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

        }

        .inputArea{
            margin-bottom: 3vh;
            
        }
    
    </style>


<div id="container">
    <h1>Teste de IMC</h1>

    <div>
        <input id="campoNome" class="inputArea" type="text" placeholder="Nome">
    </div>

    <div>
        <input id="campoPeso" class="inputArea" type="text" placeholder="Peso(Kg)">
    </div>

    <div>
        <input id="campoAltura" class="inputArea" type = "text" placeholder="Altura(m)">
    </div>

    <button id="btnConfirmar">Confirmar!</button>
</div>

    <script>

    const campoNome = document.getElementById("campoNome")
    const campoPeso = document.getElementById("campoPeso")
    const campoAltura = document.getElementById("campoAltura")
    const btnConfirmar = document.getElementById("btnConfirmar")

    btnConfirmar.addEventListener("click", function(){

        if(campoNome.value == "" || campoAltura.value == "" || campoPeso.value == ""){
            alert("Preencha todos os campos!!!")
            return

        }

        var imc = 0
        imc = campoPeso.value / (campoAltura.value * campoAltura.value)

    })
    
        
    </script>


</body>
</html>
